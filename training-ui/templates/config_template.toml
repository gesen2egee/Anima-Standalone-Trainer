# Anima LoRA Training Configuration Template
# Model paths are loaded from Global Settings automatically.

gpu_ids = "0"

[ui_arguments]
architecture = "anima"

[training_arguments]
output_name = "my_anima_lora"
save_model_as = "safetensors"
max_train_steps = 3000
save_every_n_steps = 200
save_last_n_steps_state = 1
sample_at_first = true
sample_every_n_steps = 200
save_state = true
save_state_on_train_end = true
log_with = "tensorboard"
learning_rate = 0.0003
text_encoder_lr = 0
optimizer_type = "library.came.CAME"
optimizer_args = [ "weight_decay=0.1" ]
lr_scheduler = "warmup_stable_decay"
lr_scheduler_min_lr_ratio = 0.1
lr_decay_steps = 0.1
lr_warmup_steps = 0.1
mixed_precision = "bf16"
save_precision = "bf16"
full_bf16 = true
max_data_loader_n_workers = 2
gradient_accumulation_steps = 1
max_grad_norm = 1
train_batch_size = 1
knn_noise_k = 64
use_cdc_fm = false
cdc_k_neighbors = 64
cdc_k_bandwidth = 8
cdc_dim = 8
cdc_gamma = 1.0
cdc_bandwidth_rescale = 1.0
cdc_min_bucket_size = 8
use_self_flow = false
self_flow_mask_ratio = 0.25
self_flow_representation_weight = 0.8
self_flow_ema_decay = 0.9999
self_flow_student_layer = 8
self_flow_teacher_layer = 20
self_flow_projection_dim = 768
self_flow_save_ema = true
cep_noise = 0.01
loss_type = "wavelet"
pnp_loss_weight = 0.000001
cwmi_lambda = 0.1
cwmi_levels = 4
cwmi_orientations = 4
cwmi_eps = 0.0005
wavelet_loss_c_min = 0.2
wavelet_loss_c_max = 1
wavelet_loss_alpha = 0.5
wavelet_loss_beta = 0.5
wavelet_loss_gamma = 5
wavelet_loss_weight = 1
wavelet_loss_prediction_type = "velocity"
gradient_checkpointing = true
flash_attn = false
torch_compile = false
lowram = false
blocks_to_swap = 0
persistent_data_loader_workers = true
seed = 42
cache_latents = true
cache_latents_to_disk = true
vae_batch_size = 1
vae_chunk_size = 64
vae_disable_cache = false
cache_text_encoder_outputs_to_disk = false
automask = true
automask_alpha = 128
automask_shrink = 1
automask_blur = 3
automask_model = "base-nightly"
masked_loss_random_strength = 0
multigpu_mode = "ddp"
deepspeed = false
use_cuda_direct = false
ddp_gradient_as_bucket_view = false
ddp_static_graph = false
use_fsdp = false
fsdp_sharding_strategy = "1"
fsdp_offload_params = false
fsdp_reshard_after_forward = false
fsdp_activation_checkpointing = false
fsdp_cpu_ram_efficient_loading = false
fsdp_backward_prefetch = ""
fsdp_forward_prefetch = false
fsdp_use_orig_params = true
fsdp_limit_all_gathers = true
fsdp_auto_wrap_policy = "NO_WRAP"
fsdp_min_num_params = 100000000
fsdp_transformer_layer_cls_to_wrap = ""
fsdp2_reshard_after_forward = true
fsdp2_offload_params = false
fsdp2_activation_checkpointing = false
fsdp2_cpu_ram_efficient_loading = false
fsdp2_auto_wrap_policy = "NO_WRAP"
fsdp2_min_num_params = 100000000
fsdp2_transformer_layer_cls_to_wrap = ""
step_profile = false
profile_microbatch = false

[network_arguments]
network_module = "networks.cdka"
network_dim = 16
network_alpha = 16
network_train_unet_only = true
network_args = [
  "exclude_patterns=[\".*\"]",
  "network_reg_lrs=.*self_attn.*=5e-5",
  "include_patterns=[\".*(self_attn|cross_attn)\\\\.(v_proj|output_proj)\"]",
  "allora=True"
]
auto_resume_last_state = true
auto_resume_last_state_user_set = true

[anima_arguments]
timestep_sampling = "autoshift"
discrete_flow_shift = 1
sigmoid_scale = 1
qwen3_max_token_length = 512
t5_max_token_length = 512
weighting_scheme = "uniform"
model_guidance_weight = 0
model_guidance_warmup_steps = 500
model_guidance_timestep_scaling = false
model_guidance_min_weight = 0
model_guidance_cfg_zero = false
model_guidance_zero_init_threshold = 1
model_guidance_end_step = 0
model_guidance_prob = 1
differential_guidance_scale = 3
ciop_prob = 0.0
ciop_noise_magnitude = 0.0
ciop_noise_type = "gaussian"
